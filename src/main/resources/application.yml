spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/bank
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

app:
  loader:
    batch-size: 100
  cors:
    allowed-origins: "http://localhost:4200"
